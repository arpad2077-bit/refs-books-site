# Amvera Cloud — российский хостинг для Node.js (оплата картой РФ).
# Файл читается автоматически при деплое из GitHub или через git push.
meta:
  environment: node
  toolchain:
    name: npm
    version: 22
run:
  # единственное постоянное хранилище Amvera: база аккаунтов
  # переживает перезапуск, пересборку и обновление кода
  persistenceMount: /data
  containerPort: 3000
  command: node server/server.js

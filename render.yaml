services:
  - type: web
    name: refs-books
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: refs-data
      mountPath: /var/data
      sizeGB: 1
